name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # "stable" catches regressions in current Go; the pinned minimum is what
        # the README and go.mod promise, so it has to keep building.
        #
        # The floor is 1.24 because earlier toolchains emit no LC_UUID load
        # command, and macOS 26's dyld refuses such a binary outright. Go 1.21
        # and 1.22 stamp minos 26.0 as well, so they fail twice over; 1.23 only
        # survives by stamping minos 11.0, which is luck rather than a promise.
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l ./cmd ./internal . 2>/dev/null || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The tests that read a real AVD or a real Magisk archive skip themselves
      # when the assets are missing, so a runner without an SDK still passes.
      - name: Build
        run: go build -trimpath -o avdroot-${{ runner.os }} .

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      # Pinned so a new release cannot turn the build red on its own.
      - name: Install analysers
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          go install golang.org/x/tools/cmd/deadcode@v0.50.0

      - name: staticcheck
        run: staticcheck ./...

      # deadcode prints unreachable functions but exits 0, so the output is
      # what decides. Keeping this at zero is what stops the leftovers that
      # accumulated before from coming back.
      - name: deadcode
        run: |
          out="$(deadcode -test ./... || true)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::unreachable functions found; remove them or wire them up"
            exit 1
          fi
          echo "no unreachable functions"

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Every target the release builds, so a platform-specific compile error
      # is caught on a pull request rather than at tag time.
      - name: Build all targets
        run: |
          set -e
          for target in \
            darwin/amd64 darwin/arm64 \
            linux/amd64 linux/arm64 linux/arm \
            windows/amd64 windows/arm64
          do
            os=${target%/*}; arch=${target#*/}
            echo "::group::$target"
            GOOS=$os GOARCH=$arch go build -trimpath -o /dev/null .
            echo "::endgroup::"
          done
